    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Phone frame & layout styling */
        .mobile-frame {
            max-width: 440px;
            height: 880px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.15);
            border: 8px solid #1e293b;
            border-radius: 40px;
        }

        /* Panic button radial progress */
        .panic-btn-wrapper {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        .pulse-alarm {
            animation: alarmFlash 1s infinite alternate;
        }

        @keyframes alarmFlash {
            0% { background-color: rgba(225, 29, 72, 0.9); box-shadow: 0 0 20px #e11d48; }
            100% { background-color: rgba(159, 18, 57, 0.9); box-shadow: 0 0 40px #f43f5e; }
        }

        /* Scrollbar aesthetics */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>

        // --- WEB AUDIO SYNTHESIZER FOR PANIC ALARM ---
        let audioCtx = null;
        let sirenOsc = null;
        let sirenInterval = null;

        function playPanicSiren() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                sirenOsc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                sirenOsc.type = 'sawtooth';
                sirenOsc.frequency.setValueAtTime(600, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                sirenOsc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                sirenOsc.start();

                let high = false;
                sirenInterval = setInterval(() => {
                    if (sirenOsc && audioCtx) {
                        sirenOsc.frequency.setValueAtTime(high ? 600 : 950, audioCtx.currentTime);
                        high = !high;
                    }
                }, 400);
            } catch (e) {
                console.log('Audio Context restricted or not supported:', e);
            }
        }

        function stopPanicSiren() {
            if (sirenInterval) clearInterval(sirenInterval);
            if (sirenOsc) {
                try {
                    sirenOsc.stop();
                    sirenOsc.disconnect();
                } catch(e){}
                sirenOsc = null;
            }
        }

        // --- CORE NAVIGATION & SWITCHERS ---
        function switchRole(newRole) {
            state.role = newRole;
            document.querySelectorAll('[id^="btn-role-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
            });
            const activeBtn = document.getElementById(`btn-role-${newRole.toLowerCase()}`);

            const badge = document.getElementById('role-badge');
            if (newRole === 'KEPLING') {
                badge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                badge.textContent = "KEPLING (SUPER ADMIN)";
            } else if (newRole === 'RTRW') {
                badge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30";
                badge.textContent = "PENGURUS RT/RW";
            } else {

                badge.textContent = "WARGA REGULAR";
            }

            renderCurrentTab();
        }

            state.isFrameView = !state.isFrameView;
            const container = document.getElementById('app-container');
            const btnText = document.getElementById('view-mode-text');

            if (state.isFrameView) {
                container.className = "mobile-frame w-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden relative transition-all duration-300";
                btnText.textContent = "Tampilan HP Simulator";
            } else {
                container.className = "w-full max-w-5xl h-[800px] rounded-3xl border border-slate-700 bg-slate-900 text-slate-100 flex flex-col overflow-hidden relative transition-all duration-300 shadow-2xl";
                btnText.textContent = "Tampilan Layout Lebar";
            }
        }

        function navigateTo(tab) {
            state.currentTab = tab;
            
            // Update active state in bottom nav
            ['home', 'financials', 'panic', 'services', 'hub'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                if (!navBtn) return;
                if (t === tab) {
                    if (t === 'panic') {
                        navBtn.classList.add('scale-110');
                    } else {
                        navBtn.className = "flex flex-col items-center justify-center py-1.5 text-emerald-400 font-bold";
                    }
                } else {
                    if (t === 'panic') {
                        navBtn.classList.remove('scale-110');
                    } else {
                        navBtn.className = "flex flex-col items-center justify-center py-1.5 text-slate-400 hover:text-slate-200 font-normal";
                    }
                }
            });

            renderCurrentTab();
        }

        function renderCurrentTab() {
            const area = document.getElementById('content-area');
            switch(state.currentTab) {
                case 'home': area.innerHTML = renderHomeView(); break;
                case 'financials': area.innerHTML = renderFinancialsView(); initLedgerChart(); break;
                case 'panic': area.innerHTML = renderPanicView(); initPanicListeners(); break;
                case 'services': area.innerHTML = renderServicesView(); break;
                case 'hub': area.innerHTML = renderHubView(); break;
                default: area.innerHTML = renderHomeView();
            }
        }

        // --- 5. PANIC BUTTON 3-SECOND SYSTEM ---
        function renderPanicView() {
            return `
                <div class="space-y-4 text-center">
                    <div>
                        <h2 class="text-base font-extrabold text-rose-500 flex items-center justify-center gap-2 uppercase tracking-wider">
                            <i class="fa-solid fa-triangle-exclamation animate-bounce"></i> Panic Button Emergency
                        </h2>
                        <p class="text-xs text-slate-400">Tekan dan Tahan Tombol 3 Detik untuk Kirim Sinyal Darurat</p>
                    </div>

                    <!-- Hold 3-Second Interactive Trigger Button -->
                    <div class="py-6 flex justify-center">
                        <div class="relative panic-btn-wrapper">
                            <!-- Circular Progress Ring SVG -->
                            <svg class="w-48 h-48 transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="42" stroke="rgba(225, 29, 72, 0.2)" stroke-width="8" fill="transparent" />
                                <circle id="panic-ring" cx="50" cy="50" r="42" stroke="#f43f5e" stroke-width="8" fill="transparent" 
                                    stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" class="transition-all duration-75"/>
                            </svg>

                            <button id="panic-hold-btn" class="absolute inset-4 rounded-full bg-gradient-to-br from-rose-600 to-red-800 text-white flex flex-col items-center justify-center shadow-2xl border-4 border-rose-500/40 active:scale-95 transition transform">
                                <i class="fa-solid fa-hand-pointer text-3xl mb-1 animate-pulse"></i>
                                <span class="text-xs font-black tracking-wider uppercase">TAHAN 3 DETIK</span>
                                <span class="text-[9px] text-rose-200" id="panic-timer-text">Sinyal Alarm</span>
                            </button>
                        </div>
                    </div>

                    <!-- Category Emergency Selector -->
                    <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl text-left space-y-2">
                        <label class="text-xs font-bold text-slate-300 block">Kategori Darurat Terpilih:</label>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <button onclick="selectPanicCategory('Kebakaran')" class="p-2 bg-slate-900 border border-rose-500/40 text-rose-300 rounded-xl text-left flex items-center gap-2 font-medium">
                                <i class="fa-solid fa-fire text-rose-500"></i> Kebakaran
                            </button>
                            <button onclick="selectPanicCategory('Maling/Kriminal')" class="p-2 bg-slate-900 border border-slate-700 text-slate-300 rounded-xl text-left flex items-center gap-2 font-medium">
                                <i class="fa-solid fa-user-ninja text-amber-500"></i> Kriminal / Maling
                            </button>
                            <button onclick="selectPanicCategory('Darurat Medis')" class="p-2 bg-slate-900 border border-slate-700 text-slate-300 rounded-xl text-left flex items-center gap-2 font-medium">
                                <i class="fa-solid fa-truck-medical text-emerald-500"></i> Medis / Ambulans
                            </button>
                            <button onclick="selectPanicCategory('Bencana Alam')" class="p-2 bg-slate-900 border border-slate-700 text-slate-300 rounded-xl text-left flex items-center gap-2 font-medium">
                                <i class="fa-solid fa-house-tsunami text-blue-500"></i> Bencana Alam
                            </button>
                        </div>
                    </div>

                    <!-- Active Emergency Alerts List -->
                    <div class="text-left space-y-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Log Panggilan Darurat Aktif</h3>
                        ${state.panicAlerts.map(a => `
                            <div class="bg-rose-950/40 border border-rose-500/40 p-3 rounded-2xl flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-xs text-rose-300">${a.user} - ${a.category}</p>
                                    <p class="text-[10px] text-slate-400">${a.location} • ${a.time}</p>
                                </div>
                                ${state.role === 'KEPLING' ? `
                                    <button onclick="resolvePanic('${a.id}')" class="bg-rose-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                                        Matikan Status
                                    </button>
                                ` : `
                                    <span class="text-[10px] bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded font-mono font-bold">LIVE GPS</span>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        let selectedCategory = 'Kebakaran';
        function selectPanicCategory(cat) {
            selectedCategory = cat;
            showNotification(`Kategori Darurat diubah ke: ${cat}`);
        }

        function initPanicListeners() {
            setTimeout(() => {
                const btn = document.getElementById('panic-hold-btn');
                const ring = document.getElementById('panic-ring');
                const timerText = document.getElementById('panic-timer-text');
                if (!btn || !ring) return;

                let startTime = 0;
                let animFrame = null;
                const fullDash = 263.89;

                const startHold = (e) => {
                    e.preventDefault();
                    startTime = Date.now();
                    
                    const updateProgress = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / 3000, 1);
                        
                        ring.style.strokeDashoffset = fullDash * (1 - progress);
                        timerText.textContent = `${(3 - progress * 3).toFixed(1)} Detik...`;

                        if (progress < 1) {
                            animFrame = requestAnimationFrame(updateProgress);
                        } else {
                            // 3 SECONDS TRIGGERED!
                            triggerEmergencyAlert();
                            resetBtn();
                        }
                    };
                    animFrame = requestAnimationFrame(updateProgress);
                };

                const resetBtn = () => {
                    if (animFrame) cancelAnimationFrame(animFrame);
                    ring.style.strokeDashoffset = fullDash;
                    timerText.textContent = 'Sinyal Alarm';
                };

                btn.addEventListener('mousedown', startHold);
                btn.addEventListener('touchstart', startHold);
                btn.addEventListener('mouseup', resetBtn);
                btn.addEventListener('mouseleave', resetBtn);
                btn.addEventListener('touchend', resetBtn);
            }, 100);
        }

        function triggerEmergencyAlert() {
            state.panicActive = true;
            playPanicSiren();

            document.getElementById('emergency-banner').classList.remove('hidden');
            document.getElementById('alert-title').textContent = `DARURAT: ${selectedCategory.toUpperCase()}!`;
            document.getElementById('alert-subtitle').textContent = `${state.userProfile.name} - ${state.userProfile.address}`;

            state.panicAlerts.unshift({
                id: `SOS-${Math.floor(Math.random()*90 + 10)}`,
                user: state.userProfile.name,
                category: selectedCategory,
                location: 'RT 03 (GPS: 3.321, 99.165)',
                time: 'Baru Saja',
                status: 'ACTIVE'
            });

            renderCurrentTab();
        }

        function silenceAlarm() {
            stopPanicSiren();
            document.getElementById('emergency-banner').classList.add('hidden');
            state.panicActive = false;
        }

        function resolvePanic(id) {
            silenceAlarm();
            state.panicAlerts = state.panicAlerts.filter(a => a.id !== id);
            showNotification('Status Darurat telah dipadamkan oleh Kepling.');
            renderCurrentTab();
        }

        // --- 6. COMMUNITY HUB & BURSA WARGA MODULE ---
        function renderHubView() {
            return `
                <div class="space-y-4">
                    <!-- Tab Toggle Inside Hub -->
                    <div class="flex border-b border-slate-800 text-xs font-bold text-slate-400">
                        <button onclick="switchHubTab('announcement')" id="hub-tab-announcement" class="py-2 px-4 border-b-2 border-emerald-500 text-emerald-400">
                            Papan Pengumuman
                        </button>
                        <button onclick="switchHubTab('ronda')" id="hub-tab-ronda" class="py-2 px-4 border-b-2 border-transparent hover:text-white">
                            Poskamling & Ronda
                        </button>
                        <button onclick="switchHubTab('market')" id="hub-tab-market" class="py-2 px-4 border-b-2 border-transparent hover:text-white">
                            Bursa Warga (UMKM)
                        </button>
                    </div>

                    <!-- Dynamic Hub Content Container -->
                    <div id="hub-subcontent" class="space-y-3">
                        ${renderAnnouncementsSubtab()}
                    </div>
                </div>
            `;
        }

        function switchHubTab(subtab) {
            ['announcement', 'ronda', 'market'].forEach(t => {
                const btn = document.getElementById(`hub-tab-${t}`);
                if (!btn) return;
                if (t === subtab) {
                    btn.className = "py-2 px-4 border-b-2 border-emerald-500 text-emerald-400 font-bold";
                } else {
                    btn.className = "py-2 px-4 border-b-2 border-transparent text-slate-400 hover:text-white font-normal";
                }
            });

            const sub = document.getElementById('hub-subcontent');
            if (subtab === 'announcement') sub.innerHTML = renderAnnouncementsSubtab();
            if (subtab === 'ronda') sub.innerHTML = renderRondaSubtab();
            if (subtab === 'market') sub.innerHTML = renderMarketSubtab();

        function renderAnnouncementsSubtab() {
            return `

                        <div class="bg-slate-800/80 border border-slate-700 p-3.5 rounded-2xl space-y-1">

        function renderRondaSubtab() {

        function openBroadcastModal() {
            const html = `
                <div class="space-y-3">

                price: price,

        // --- GLOBAL HELPER MODAL & TOAST FUNCTIONS ---
        function openModal(htmlContent) {
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function showNotification(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed top-6 right-6 bg-emerald-600 text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-2xl z-50 flex items-center space-x-2 animate-bounce";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-base"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // --- CLOCK CONTROLLER ---
        setInterval(() => {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const el = document.getElementById('clock-time');
            if (el) el.textContent = `${hrs}:${mins}`;
        }, 1000);

        // INITIAL RENDERING ON LOAD
        window.onload = function() {
            renderCurrentTab();
        };
    </script>
